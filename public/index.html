<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Wealth Ledger — Net Worth &amp; Retirement Planner</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wealth">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#8377;</text></svg>">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">&#8377;</span>
      <div>
        <h1>Wealth Ledger</h1>
        <p class="brand-sub">Multi-country net worth</p>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="dashboard"><span class="nav-ico">&#9632;</span>Dashboard</button>
      <button class="nav-item" data-view="holdings"><span class="nav-ico">&#9776;</span>Holdings</button>
      <button class="nav-item" data-view="analytics"><span class="nav-ico">&#8599;</span>Wealth Analytics</button>
      <button class="nav-item" data-view="allocation"><span class="nav-ico">&#9678;</span>Allocation</button>
      <button class="nav-item" data-view="health"><span class="nav-ico">&#9829;</span>Portfolio health</button>
      <button class="nav-item" data-view="goals"><span class="nav-ico">&#9873;</span>Goals</button>
      <button class="nav-item" data-view="planner"><span class="nav-ico">&#9737;</span>Retirement</button>
      <button class="nav-item" data-view="tax"><span class="nav-ico">&#8377;</span>India Tax</button>
      <button class="nav-item" data-view="profile"><span class="nav-ico">&#9787;</span>Profile</button>
      <button class="nav-item" data-view="settings"><span class="nav-ico">&#9881;</span>Settings</button>
      <button class="nav-item" data-view="report"><span class="nav-ico">&#9635;</span>Generate PDF Report</button>
    </nav>

    <div class="sidebar-foot">
      <div class="fx-chip" id="fx-chip" title="Currency rates used for INR conversion">
        <span class="fx-dot" id="fx-dot"></span>
        <span id="fx-status">Loading rates…</span>
      </div>
      <p class="data-file" id="data-file"></p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 class="view-title" id="view-title">Dashboard</h2>
        <p class="view-sub" id="view-sub">Your consolidated position, restated in Indian Rupees.</p>
      </div>
      <div class="topbar-right">
        <div class="nw-pill">
          <span class="nw-label">Net worth</span>
          <strong id="topbar-networth">—</strong>
        </div>
        <button class="btn btn-ghost" id="btn-refresh-fx" title="Fetch today's ECB reference rates">Refresh rates</button>
      </div>
    </header>

    <div id="banner-zone"></div>

    <section class="view" id="view-dashboard"></section>
    <section class="view is-hidden" id="view-holdings"></section>
    <section class="view is-hidden" id="view-analytics"></section>
    <section class="view is-hidden" id="view-allocation"></section>
    <section class="view is-hidden" id="view-health"></section>
    <section class="view is-hidden" id="view-goals"></section>
    <section class="view is-hidden" id="view-planner"></section>
    <section class="view is-hidden" id="view-tax"></section>
    <section class="view is-hidden" id="view-profile"></section>
    <section class="view is-hidden" id="view-settings"></section>
    <section class="view is-hidden" id="view-report"></section>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h3 id="modal-title">Holding</h3>
      <button class="icon-btn" data-close aria-label="Close">&times;</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot">
      <span class="modal-hint" id="modal-hint"></span>
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save</button>
    </footer>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/vendor/chart.umd.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
